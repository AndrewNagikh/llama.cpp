# 3-node distributed cluster for local Docker testing.
# Build context: llama.cpp repo root. HF token: repo-root ../../../../.env (node-agent/.env)
#
#   cd llama.cpp/tools/distributed/docker
#   docker compose up --build
#
# Smoke: ./smoke.sh

name: dist-llm

services:
  orchestrator:
    build:
      context: ../../..
      dockerfile: tools/distributed/docker/Dockerfile
    image: dist-llm:local
    container_name: dist-orchestrator
    command:
      - /app/orchestrator
      - --listen
      - 0.0.0.0:9000
      - --models-dir
      - /data/models
    environment:
      HEALTH_PORT: "9000"
      MODELS_DIR: /data/models
    env_file:
      - ../../../../.env
    ports:
      - "9000:9000"
    volumes:
      - dist-models:/data/models
    networks:
      dist-net:
        aliases:
          - orchestrator
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  node-a:
    image: dist-llm:local
    container_name: dist-node-a
    command:
      - /app/node_agent
      - --listen
      - 0.0.0.0:9001
      - --orchestrator
      - http://orchestrator:9000
      - --node-id
      - node-a
      - --advertise-host
      - node-a
      - --models-dir
      - /data/models
    environment:
      MODELS_DIR: /data/models
    env_file:
      - ../../../../.env
    ports:
      - "9001:9001"
    volumes:
      - dist-models:/data/models
    networks:
      dist-net:
        aliases:
          - node-a
    depends_on:
      orchestrator:
        condition: service_healthy

  node-b:
    image: dist-llm:local
    container_name: dist-node-b
    command:
      - /app/node_agent
      - --listen
      - 0.0.0.0:9002
      - --orchestrator
      - http://orchestrator:9000
      - --node-id
      - node-b
      - --advertise-host
      - node-b
      - --models-dir
      - /data/models
    environment:
      MODELS_DIR: /data/models
    env_file:
      - ../../../../.env
    ports:
      - "9002:9002"
    volumes:
      - dist-models:/data/models
    networks:
      dist-net:
        aliases:
          - node-b
    depends_on:
      orchestrator:
        condition: service_healthy

  node-c:
    image: dist-llm:local
    container_name: dist-node-c
    command:
      - /app/node_agent
      - --listen
      - 0.0.0.0:9003
      - --orchestrator
      - http://orchestrator:9000
      - --node-id
      - node-c
      - --advertise-host
      - node-c
      - --models-dir
      - /data/models
    environment:
      MODELS_DIR: /data/models
    env_file:
      - ../../../../.env
    ports:
      - "9003:9003"
    volumes:
      - dist-models:/data/models
    networks:
      dist-net:
        aliases:
          - node-c
    depends_on:
      orchestrator:
        condition: service_healthy

volumes:
  dist-models:

networks:
  dist-net:
    driver: bridge
