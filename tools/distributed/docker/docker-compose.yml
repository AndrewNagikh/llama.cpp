# 3-node distributed cluster for local Docker testing.
# Build context: llama.cpp repo root. HF token: repo-root ../../../../.env (node-agent/.env)
#
#   cd llama.cpp/tools/distributed/docker
#   docker compose up --build
#
# Smoke: ./smoke.sh

name: dist-llm

services:
  orchestrator:
    build:
      context: ../../..
      dockerfile: tools/distributed/docker/Dockerfile
    image: dist-llm:local
    container_name: dist-orchestrator
    command:
      - /app/orchestrator
      - --listen
      - 0.0.0.0:9000
      - --models-dir
      - /data/models
    environment:
      HEALTH_PORT: "9000"
      MODELS_DIR: /data/models
      DIST_EXTERNAL_EMBEDDING: ${DIST_EXTERNAL_EMBEDDING:-1}
      DIST_EXTERNAL_OUTPUT: ${DIST_EXTERNAL_OUTPUT:-1}
      DIST_RUNTIME_LAYER_FIRST: ${DIST_RUNTIME_LAYER_FIRST:-1}
      DIST_GRAPH_TRACE: ${DIST_GRAPH_TRACE:-0}
      DIST_PIPE_TRACE: ${DIST_PIPE_TRACE:-0}
      DIST_PERF_TRACE: ${DIST_PERF_TRACE:-0}
      DIST_PERF_TRACE_GGML: ${DIST_PERF_TRACE_GGML:-0}
      DIST_PERF_GPU_POLL_MS: ${DIST_PERF_GPU_POLL_MS:-100}
      DIST_PERF_TRACE_DIR: /data/models/perf_trace
    env_file:
      - ../../../../.env
    ports:
      - "9000:9000"
    volumes:
      - dist-models:/data/models
      - dist-perf-trace:/data/models/perf_trace
    networks:
      dist-net:
        aliases:
          - orchestrator
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  node-a:
    image: dist-llm:local
    container_name: dist-node-a
    command:
      - /app/node_agent
      - --listen
      - 0.0.0.0:9001
      - --orchestrator
      - http://orchestrator:9000
      - --node-id
      - node-a
      - --advertise-host
      - node-a
      - --models-dir
      - /data/models
    environment:
      MODELS_DIR: /data/models
      DIST_EXTERNAL_EMBEDDING: ${DIST_EXTERNAL_EMBEDDING:-1}
      DIST_EXTERNAL_OUTPUT: ${DIST_EXTERNAL_OUTPUT:-1}
      DIST_RUNTIME_LAYER_FIRST: ${DIST_RUNTIME_LAYER_FIRST:-1}
      DIST_GRAPH_TRACE: ${DIST_GRAPH_TRACE:-0}
      DIST_PIPE_TRACE: ${DIST_PIPE_TRACE:-0}
      DIST_PERF_TRACE: ${DIST_PERF_TRACE:-0}
      DIST_PERF_TRACE_GGML: ${DIST_PERF_TRACE_GGML:-0}
      DIST_PERF_GPU_POLL_MS: ${DIST_PERF_GPU_POLL_MS:-100}
      DIST_PERF_TRACE_DIR: /data/models/perf_trace
    env_file:
      - ../../../../.env
    ports:
      - "9001:9001"
    volumes:
      - dist-models-a:/data/models
      - dist-perf-trace:/data/models/perf_trace
    networks:
      dist-net:
        aliases:
          - node-a
    depends_on:
      orchestrator:
        condition: service_healthy

  node-b:
    image: dist-llm:local
    container_name: dist-node-b
    command:
      - /app/node_agent
      - --listen
      - 0.0.0.0:9002
      - --orchestrator
      - http://orchestrator:9000
      - --node-id
      - node-b
      - --advertise-host
      - node-b
      - --models-dir
      - /data/models
    environment:
      MODELS_DIR: /data/models
      DIST_EXTERNAL_EMBEDDING: ${DIST_EXTERNAL_EMBEDDING:-1}
      DIST_EXTERNAL_OUTPUT: ${DIST_EXTERNAL_OUTPUT:-1}
      DIST_RUNTIME_LAYER_FIRST: ${DIST_RUNTIME_LAYER_FIRST:-1}
      DIST_GRAPH_TRACE: ${DIST_GRAPH_TRACE:-0}
      DIST_PIPE_TRACE: ${DIST_PIPE_TRACE:-0}
      DIST_PERF_TRACE: ${DIST_PERF_TRACE:-0}
      DIST_PERF_TRACE_GGML: ${DIST_PERF_TRACE_GGML:-0}
      DIST_PERF_GPU_POLL_MS: ${DIST_PERF_GPU_POLL_MS:-100}
      DIST_PERF_TRACE_DIR: /data/models/perf_trace
    env_file:
      - ../../../../.env
    ports:
      - "9002:9002"
    volumes:
      - dist-models-b:/data/models
      - dist-perf-trace:/data/models/perf_trace
    networks:
      dist-net:
        aliases:
          - node-b
    depends_on:
      orchestrator:
        condition: service_healthy

  node-c:
    image: dist-llm:local
    container_name: dist-node-c
    command:
      - /app/node_agent
      - --listen
      - 0.0.0.0:9003
      - --orchestrator
      - http://orchestrator:9000
      - --node-id
      - node-c
      - --advertise-host
      - node-c
      - --models-dir
      - /data/models
    environment:
      MODELS_DIR: /data/models
      DIST_EXTERNAL_EMBEDDING: ${DIST_EXTERNAL_EMBEDDING:-1}
      DIST_EXTERNAL_OUTPUT: ${DIST_EXTERNAL_OUTPUT:-1}
      DIST_RUNTIME_LAYER_FIRST: ${DIST_RUNTIME_LAYER_FIRST:-1}
      DIST_GRAPH_TRACE: ${DIST_GRAPH_TRACE:-0}
      DIST_PIPE_TRACE: ${DIST_PIPE_TRACE:-0}
      DIST_PERF_TRACE: ${DIST_PERF_TRACE:-0}
      DIST_PERF_TRACE_GGML: ${DIST_PERF_TRACE_GGML:-0}
      DIST_PERF_GPU_POLL_MS: ${DIST_PERF_GPU_POLL_MS:-100}
      DIST_PERF_TRACE_DIR: /data/models/perf_trace
    env_file:
      - ../../../../.env
    ports:
      - "9003:9003"
    volumes:
      - dist-models-c:/data/models
      - dist-perf-trace:/data/models/perf_trace
    networks:
      dist-net:
        aliases:
          - node-c
    depends_on:
      orchestrator:
        condition: service_healthy

volumes:
  dist-models:
  dist-models-a:
  dist-models-b:
  dist-models-c:
  dist-perf-trace:

networks:
  dist-net:
    driver: bridge
